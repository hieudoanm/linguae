[workspace]
resolver = "2"
members = ["linguae-core", "linguae-cli", "linguae-data", "linguae-train"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hieudoanm/linguae"

[workspace.dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1"
env_logger = "0.11"
log = "0.4"
plotters = { version = "0.3", default-features = false, features = [
  "svg_backend",
  "line_series",
  "point_series",
  "full_palette",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
