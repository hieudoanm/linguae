[workspace]
resolver = "2"
members = ["linguae-core", "linguae-cli", "linguae-data"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hieudoanm/linguae"

[workspace.dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
