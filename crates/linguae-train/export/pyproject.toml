[project]
name = "linguae-model-export"
version = "0.0.1"
description = "Export the linguae CharCNN artifact to self-contained model files"
readme = "README.md"
authors = [
    { name = "HIEU DOAN", email = "49260251+hieudoanm@users.noreply.github.com" }
]
requires-python = "==3.15.2"
dependencies = [
    "joblib==1.6.0",
    "numpy==2.5.5",
    "torch==2.15.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build==0.13.10"]
build-backend = "uv_build"
