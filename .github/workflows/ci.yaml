name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app/server
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.8"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run lint
        run: |
          uv run ruff check src

      - name: Run tests
        run: |
          uv run pytest tests -v

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app/web
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: "12.15.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "26.12.1"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install

      - name: Run lint
        run: |
          pnpm run lint

      - name: Run tests
        run: |
          pnpm run test:run

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.8"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
          uv pip install pyinstaller

      - name: Build CLI binary
        run: |
          make build

      - name: Zip CLI binary
        run: |
          cd dist
          zip -9 linguae.zip linguae
          ls -lh linguae.zip

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linguae-cli
          path: packages/cli/dist/linguae.zip
          retention-days: 1

  release:
    name: Release (latest)
    needs: [cli]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: linguae-cli
          path: dist

      - name: Unzip CLI binary
        run: |
          cd dist
          unzip -o linguae.zip
          rm -f linguae.zip
          ls -lh linguae

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: latest
          name: Latest Release
          body: |
            Automated release from commit ${{ github.sha }}
          files: |
            dist/linguae.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
