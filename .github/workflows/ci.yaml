name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build CLI binary
        run: cargo build --release -p linguae

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linguae-cli
          path: crates/target/release/linguae
          retention-days: 1

  desktop:
    name: Desktop - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install

      - name: Run lint
        run: |
          pnpm run lint

      - name: Run tests
        run: |
          pnpm run test:run

      - name: Build desktop
        run: |
          pnpm run build

      - name: Upload desktop out artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-out
          path: packages/desktop/out
          retention-days: 1

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1

  desktop-tauri:
    name: Desktop - Build Tauri (${{ matrix.os }})
    needs: [desktop]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev rpm

      - name: Install dependencies
        working-directory: packages/desktop
        run: pnpm install

      - name: Download desktop out artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: desktop-out
          path: packages/desktop/out

      - name: Build Tauri
        working-directory: packages/desktop
        run: pnpm run tauri:build

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd packages/desktop/src-tauri/target/release/bundle/macos
          zip -r Linguae.app.zip *.app

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-release-${{ matrix.os }}
          path: packages/desktop/src-tauri/target/release/bundle
          retention-days: 1

  release:
    name: Release
    needs: [desktop-tauri, cli]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all Tauri bundles
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: bundles

      - name: Download CLI binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: linguae-cli
          path: release-assets

      - name: Prepare release asset
        run: |
          find release-assets -type f -name 'linguae' -exec mv {} linguae \;
          ls -lh linguae
          cp README.md release_notes_final.md

      - name: Remove old release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
            gh release delete-asset latest "$asset" --yes || true
          done

      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --title "Linguae (latest)" --notes-file README.md --prerelease=false

      - name: Upload bundles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find bundles -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) -exec gh release upload latest {} --clobber \;

      - name: Upload asset to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest linguae --clobber
          cd crates/linguae-train/artifacts
          zip -r linguae-artifacts.zip linguae
          gh release upload latest linguae-artifacts.zip --clobber

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit latest --notes-file release_notes_final.md --title "Linguae (latest)"
