name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-quality:
    name: CLI - Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  cli-build:
    name: CLI - Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-quality` job.
    if: github.event_name != 'pull_request'
    needs: cli-quality
    defaults:
      run:
        working-directory: crates
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build CLI binary
        run: cargo build --release -p linguae

      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/linguae cli-linguae-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/linguae cli-linguae-aarch64-apple-darwin ;;
            macos-15-intel) mv target/release/linguae cli-linguae-x86_64-apple-darwin ;;
            windows-latest) mv target/release/linguae.exe cli-linguae-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-linguae-${{ matrix.os }}
          path: crates/cli-linguae-*
          if-no-files-found: error
          retention-days: 7

  desktop-quality:
    name: Desktop check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:run

  desktop-build:
    name: Desktop - Build
    needs: desktop-quality
    # The `out/` bundle is only needed by `desktop-build` for releases;
    # PRs are covered by the `desktop-quality` job.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build desktop
        run: |
          pnpm run build

      - name: Upload desktop out artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-out
          path: packages/desktop/out
          retention-days: 1

  desktop-tauri:
    name: Desktop build (${{ matrix.os }})
    needs:
      - desktop-build
    # Release bundles are only needed for the master-branch release job;
    # PRs are covered by the `desktop-quality` job.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev rpm

      - name: Install dependencies
        working-directory: packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Download desktop out artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: desktop-out
          path: packages/desktop/out

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles app,dmg

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        working-directory: packages/desktop/src-tauri/target/release/bundle/macos
        run: zip -r Linguae.app.zip Linguae.app

      # Both Mac legs produce identically named bundles; rename per-arch
      # before the artifacts merge in the release job.
      - name: Rename macOS bundles for release
        if: runner.os == 'macOS'
        working-directory: packages/desktop/src-tauri/target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            triple=aarch64-apple-darwin
          else
            triple=x86_64-apple-darwin
          fi
          shopt -s nullglob
          for f in dmg/*.dmg; do mv "$f" "dmg/desktop-linguae-${triple}.dmg"; done
          for f in macos/*.app.zip; do mv "$f" "macos/desktop-linguae-${triple}.app.zip"; done

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles deb,rpm,appimage

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles msi,nsis

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linguae-desktop-${{ matrix.os }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linguae-desktop-${{ matrix.os }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linguae-desktop-${{ matrix.os }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  model-build:
    name: Model - Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Export model formats
        working-directory: crates/linguae-train/scripts
        env:
          UV_TORCH_BACKEND: cpu
        run: uv run --python 3.13 python export_models.py

      - name: Upload model exports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linguae-models
          path: crates/linguae-train/artifacts/models
          if-no-files-found: error
          retention-days: 7

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install landing dependencies
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        working-directory: packages/landing
        run: pnpm run typecheck

      - name: Lint landing
        working-directory: packages/landing
        run: pnpm run lint

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1

  release:
    name: Release
    needs:
      - cli-build
      - desktop-tauri
      - model-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download CLI binaries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-linguae-*
          merge-multiple: true
          path: release-assets

      - name: Download desktop bundles
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: linguae-desktop-*
          merge-multiple: true
          path: bundles

      - name: Download model exports
        uses: actions/download-artifact@v8.0.2
        with:
          name: linguae-models
          path: crates/linguae-train/artifacts/models

      # Tauri bundles keep their build-time names (Linguae_0.0.1_...);
      # normalize everything to desktop-linguae-<target>.<ext>. Glob by
      # extension, never by product name. macOS bundles are already renamed
      # per-arch at build time because both Mac legs emit identically named
      # files.
      - name: Normalize release asset names
        shell: bash
        run: |
          set -euo pipefail
          cd bundles
          shopt -s nullglob globstar
          for f in **/*.deb; do mv "$f" desktop-linguae-x86_64-unknown-linux-gnu.deb; done
          for f in **/*.rpm; do mv "$f" desktop-linguae-x86_64-unknown-linux-gnu.rpm; done
          for f in **/*.AppImage; do mv "$f" desktop-linguae-x86_64-unknown-linux-gnu.AppImage; done
          for f in **/*.msi; do mv "$f" desktop-linguae-x86_64-pc-windows-msvc.msi; done
          for f in **/*-setup.exe; do mv "$f" desktop-linguae-x86_64-pc-windows-msvc-setup.exe; done
          ls -1

      - name: Prepare release notes
        run: cp RELEASE.md release_notes_final.md

      - name: Remove old release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
            gh release delete-asset latest "$asset" --yes || true
          done

      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --title "Linguae (latest)" --notes-file RELEASE.md --prerelease=false

      - name: Upload bundles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find bundles -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) -exec gh release upload latest {} --clobber \;

      - name: Upload CLI binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release-assets -type f -exec gh release upload latest {} --clobber \;
          cd crates/linguae-train/artifacts
          zip -r cli-linguae-model.zip linguae models
          gh release upload latest cli-linguae-model.zip --clobber

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit latest --notes-file release_notes_final.md --title "Linguae (latest)"
