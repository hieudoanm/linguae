name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build CLI binary
        run: cargo build --release -p linguae

      - name: Zip CLI binary
        run: |
          mkdir -p dist
          cp target/release/linguae dist/linguae
          cd dist
          zip -9 linguae.zip linguae
          ls -lh linguae.zip

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linguae-cli
          path: crates/dist/linguae.zip
          retention-days: 1

  desktop:
    name: Desktop - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: "12.16.1"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install

      - name: Run lint
        run: |
          pnpm run lint

      - name: Run tests
        run: |
          pnpm run test:run

      - name: Build desktop
        run: |
          pnpm run build

      - name: Upload desktop out artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-out
          path: packages/desktop/out
          retention-days: 1

  desktop-tauri:
    name: Desktop - Build Tauri (${{ matrix.os }})
    needs: [desktop]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: "12.16.1"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          cache: "pnpm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev rpm

      - name: Install dependencies
        working-directory: packages/desktop
        run: pnpm install

      - name: Download desktop out artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: desktop-out
          path: packages/desktop/out

      - name: Build Tauri
        working-directory: packages/desktop
        run: pnpm run tauri:build

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd packages/desktop/src-tauri/target/release/bundle/macos
          zip -r Linguae.zip *.app

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-release-${{ matrix.os }}
          path: packages/desktop/src-tauri/target/release/bundle
          retention-days: 1

  release:
    name: Release
    needs: [desktop-tauri, cli]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download all Tauri bundles
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: bundles

      - name: Download CLI binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: linguae-cli
          path: release-assets

      - name: Prepare release asset
        run: |
          find release-assets -name 'linguae.zip' -exec mv {} linguae.zip \;
          ls -lh linguae.zip
          SIZE=$(stat -c%s linguae.zip)
          echo "zip size: ${SIZE} bytes"
          if [ "$SIZE" -gt 2147483647 ]; then
            echo "Splitting into parts..."
            split -b 1900m linguae.zip linguae.zip.part.
            rm linguae.zip
            ls -lh linguae.zip.part.*
            {
              echo -e "\n\n---\n\n## Download\n\nThe CLI binary is too large for a single GitHub release asset. Download all parts and reassemble:\n"
              echo -e "\`\`\`bash\ncat linguae.zip.part.* > linguae.zip\nunzip linguae.zip\n./linguae\n\`\`\`"
            } > /tmp/release_notes.txt
            cat README.md /tmp/release_notes.txt > release_notes_final.md
          else
            cp README.md release_notes_final.md
          fi

      - name: Create release if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --title "Linguae (latest)" --notes-file README.md --prerelease=false

      - name: Upload bundles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find bundles -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) -exec gh release upload latest {} --clobber \;

      - name: Upload asset to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f linguae.zip ]; then
            gh release upload latest linguae.zip --clobber
          else
            gh release upload latest linguae.zip.part.* --clobber
          fi

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit latest --notes-file release_notes_final.md --title "Linguae (latest)"
