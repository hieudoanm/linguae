<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" rx="32" fill="#1b1b1f"/>

  <!-- Centered content group at (640, 320) -->
  <g transform="translate(640, 320)" text-anchor="middle">
    <!-- Logo icon, left of center at (-300, 0) -->
    <g transform="translate(-500, -220) scale(0.859375)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
        <rect width="512" height="512" rx="64" fill="#1b1b1f"/>

        <!-- Concentric signal rings -->
        <circle cx="256" cy="256" r="180" fill="none" stroke="#efefec" stroke-width="2" opacity="0.25"/>
        <circle cx="256" cy="256" r="140" fill="none" stroke="#efefec" stroke-width="2" opacity="0.35"/>
        <circle cx="256" cy="256" r="100" fill="none" stroke="#efefec" stroke-width="2" opacity="0.45"/>

        <!-- Central node -->
        <circle cx="256" cy="256" r="36" fill="#efefec" opacity="0.15"/>
        <circle cx="256" cy="256" r="18" fill="#efefec"/>

        <!-- Four language glyphs on the rings -->
        <text x="256" y="118" text-anchor="middle" dominant-baseline="middle"
              font-family="system-ui, sans-serif" font-size="40" font-weight="700"
              fill="#efefec">A</text>

        <text x="396" y="256" text-anchor="middle" dominant-baseline="middle"
              font-family="system-ui, sans-serif" font-size="40" font-weight="700"
              fill="#efefec">Я</text>

        <text x="256" y="394" text-anchor="middle" dominant-baseline="middle"
              font-family="system-ui, sans-serif" font-size="40" font-weight="700"
              fill="#efefec">字</text>

        <text x="116" y="256" text-anchor="middle" dominant-baseline="middle"
              font-family="system-ui, sans-serif" font-size="40" font-weight="700"
              fill="#efefec">م</text>

        <!-- Connecting lines from center to each glyph -->
        <line x1="256" y1="256" x2="256" y2="118" stroke="#efefec" stroke-width="2" opacity="0.5"/>
        <line x1="256" y1="256" x2="396" y2="256" stroke="#efefec" stroke-width="2" opacity="0.5"/>
        <line x1="256" y1="256" x2="256" y2="394" stroke="#efefec" stroke-width="2" opacity="0.5"/>
        <line x1="256" y1="256" x2="116" y2="256" stroke="#efefec" stroke-width="2" opacity="0.5"/>
      </svg>
    </g>
    <!-- Text block, right of center at (260, 0) -->
    <g transform="translate(260, 0)" text-anchor="middle">
      <text y="-30" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="#efefec" letter-spacing="-3">Linguae</text>
      <text y="50" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#efefec">Detect language, locally</text>
      <text y="130" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#efefec">Character-level CNN · PyTorch · No cloud</text>
    </g>
  </g>
</svg>
