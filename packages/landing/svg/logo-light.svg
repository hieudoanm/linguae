<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#e9e9e6"/>

  <!-- Concentric signal rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#33322e" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#33322e" stroke-width="2" opacity="0.35"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#33322e" stroke-width="2" opacity="0.45"/>

  <!-- Central node -->
  <circle cx="256" cy="256" r="36" fill="#33322e" opacity="0.15"/>
  <circle cx="256" cy="256" r="18" fill="#33322e"/>

  <!-- Four language glyphs on the rings -->
  <text x="256" y="118" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, sans-serif" font-size="40" font-weight="700"
        fill="#33322e">A</text>

  <text x="396" y="256" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, sans-serif" font-size="40" font-weight="700"
        fill="#33322e">Я</text>

  <text x="256" y="394" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, sans-serif" font-size="40" font-weight="700"
        fill="#33322e">字</text>

  <text x="116" y="256" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, sans-serif" font-size="40" font-weight="700"
        fill="#33322e">م</text>

  <!-- Connecting lines from center to each glyph -->
  <line x1="256" y1="256" x2="256" y2="118" stroke="#33322e" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="256" x2="396" y2="256" stroke="#33322e" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="256" x2="256" y2="394" stroke="#33322e" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="256" x2="116" y2="256" stroke="#33322e" stroke-width="2" opacity="0.5"/>
</svg>
