[package]
name = "linguae"
version = "0.0.1"
authors = ["hieudoanm"]
edition = "2021"
description = "A local-first language detection desktop app built with Tauri"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
