[project]
name = "linguae-server"
version = "0.0.1"
description = "FastAPI server for the Linguae language detector"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
  "torch==2.15.0",
  "numpy==2.5.4",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "python-multipart==0.0.32",
  "starlette==1.10.0",
]

[project.scripts]
linguae-server = "linguae_server.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linguae_server"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]